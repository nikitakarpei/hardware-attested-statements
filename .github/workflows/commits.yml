# Every pull request and push to main: commit messages follow Conventional Commits and carry Signed-off-by
# (CONTRIBUTING.md). The rules are in .github/commitlint; commitlint is installed from its lockfile.

name: commits

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install commitlint
        run: npm ci --prefix .github/commitlint --no-audit --no-fund

      - name: Check the commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          lint() { .github/commitlint/node_modules/.bin/commitlint --config .github/commitlint/commitlint.config.mjs "$@"; }
          if [ "$EVENT" = pull_request ]; then
            lint --from "$BASE" --to "$HEAD"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            for c in $(git rev-list "$AFTER"); do git log -1 --format=%B "$c" | lint; done   # a new branch: all of it
          else
            lint --from "$BEFORE" --to "$AFTER"
          fi
